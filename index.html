<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teach the Machine · Digital Pasts</title>
<meta name="description" content="An image-classification lab for archaeology students using Google Teachable Machine. ARCH3215 / ARCH8215 Digital Pasts, Flinders University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#232D4B; --navy-d:#141b33; --navy-dd:#0a0f24; --gold:#FFD300; --gold-l:#ffe680; --gold-d:#c99a00;
  --ink:#f3f5fb; --muted:#bcc5e0; --line:#e3e8f6; --win-top:#34478c; --win-bot:#141c3e;
  --ok:#7fe08a; --bad:#ff8080; --cyan:#6ad1ff; --field:#0b1130; --field-line:#5d6dab;
  --head:'Chakra Petch', 'Trebuchet MS', sans-serif; --body:'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:17px/1.55 var(--body);
  background-color:#0d1330;
  background-image:repeating-conic-gradient(#0c122d 0 25%, #111840 0 50%);
  background-size:4px 4px;min-height:100vh}
[hidden]{display:none!important}
a{color:var(--gold-l)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 40px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.plate{background:#fff;border-radius:6px;padding:6px 10px;box-shadow:0 3px 0 #050817, inset 0 0 0 2px #cfd6ea;display:flex}
.plate img{display:block;height:34px;width:auto}
.course{font:700 13px/1.25 var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--gold-l);text-shadow:1px 1px 0 #000}
.course small{display:block;color:var(--muted);font-weight:600;letter-spacing:.04em}
.top .sp{flex:1}
.player{font:700 13px var(--head);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.player b{color:#fff}
.saved{font:700 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.75;transition:color .2s}
.saved.on{color:var(--ok);opacity:1}
.saved.off{color:var(--bad)}

/* buttons */
.btn{appearance:none;border:2px solid #fff4b8;border-radius:6px;cursor:pointer;
  background:linear-gradient(180deg,#fff08a 0%,var(--gold) 48%,#e5b600 52%,var(--gold-d) 100%);
  color:#151b33;font:700 15px/1 var(--head);letter-spacing:.06em;text-transform:uppercase;
  padding:12px 18px;box-shadow:0 4px 0 #5f4800, 0 6px 10px rgba(0,0,0,.4);text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5f4800}
.btn[disabled]{filter:grayscale(1) brightness(.7);cursor:not-allowed;transform:none}
.btn.alt{background:linear-gradient(180deg,#4a5fae 0%,#2c3c7c 50%,#1f2b5e 51%,#18224a 100%);color:#fff;border-color:#c9d2f0;box-shadow:0 4px 0 #050817}
.btn.small{font-size:13px;padding:8px 12px;min-height:38px}
.btn.danger{background:linear-gradient(180deg,#ff9b9b,#d84a4a 52%,#a82e2e);color:#fff;border-color:#ffd0d0;box-shadow:0 4px 0 #4a1010}

/* progress */
.progress{margin:6px 0 12px}
.prog-label{display:flex;justify-content:space-between;gap:12px;font:700 13px var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.prog-label b{color:var(--gold)}
.prog{display:grid;gap:4px;grid-template-columns:repeat(var(--n),1fr)}
.pb{appearance:none;height:18px;border:2px solid #6f80c0;background:#0b1130;border-radius:3px;transform:skewX(-14deg);cursor:pointer;padding:0}
.pb.done{background:linear-gradient(180deg,#fff08a,var(--gold) 50%,var(--gold-d));border-color:#fff4b8}
.pb.cur{background:linear-gradient(180deg,#fff,#cfe9ff 50%,#7fbfff);border-color:#fff;animation:pulse 1.2s steps(2) infinite}
.pb[disabled]{cursor:not-allowed;opacity:.6}
@keyframes pulse{50%{filter:brightness(.75)}}

/* stage banner */
.stage{position:relative;border-radius:8px;overflow:hidden;border:2px solid var(--line);box-shadow:inset 0 0 0 2px #0a0f26, 0 5px 0 #050817;background:#0a0f24}
.stage canvas{display:block;width:100%;height:clamp(170px,28vw,250px);image-rendering:pixelated;image-rendering:crisp-edges}
.stage.big canvas{height:clamp(230px,40vw,340px)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),linear-gradient(180deg,transparent 45%,rgba(5,8,23,.85));}
.stage-text{position:absolute;left:16px;right:16px;bottom:12px;z-index:1}
.kicker{font:700 13px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-shadow:2px 2px 0 #000}
.stage h1,.stage h2{margin:2px 0 0;font:700 clamp(24px,4.6vw,38px)/1.05 var(--head);text-transform:uppercase;letter-spacing:.02em;color:#fff;text-shadow:2px 2px 0 #000,0 0 18px rgba(0,0,0,.6)}
.chrome{background:linear-gradient(180deg,#fff 0%,#fff6c4 40%,var(--gold) 52%,#ffe45c 70%,var(--gold-d) 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none!important;filter:drop-shadow(3px 3px 0 #000)}
.stage.big h1{font-size:clamp(34px,8vw,64px)}
.stage .sub{font:700 clamp(13px,2.2vw,17px) var(--head);color:#dfe6ff;text-shadow:2px 2px 0 #000;letter-spacing:.04em;margin-top:4px}

/* windows */
.win{position:relative;margin-top:18px;padding:18px 20px;border-radius:8px;border:2px solid var(--line);
  background:linear-gradient(180deg,var(--win-top) 0%,#22306a 30%,var(--win-bot) 100%);
  box-shadow:inset 0 0 0 2px #0a0f26, inset 0 0 0 3px #7183c6, 0 5px 0 #050817}
.win > :first-child{margin-top:0}
.win h3{margin:0 0 10px;font:700 18px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--gold);text-shadow:2px 2px 0 #000}
p{margin:0 0 12px}
.lead{font-size:18px}
ul.dots{margin:0 0 12px;padding-left:0;list-style:none}
ul.dots li{position:relative;padding-left:26px;margin:4px 0}
ul.dots li::before{content:"";position:absolute;left:4px;top:.5em;width:10px;height:10px;background:var(--gold);transform:rotate(45deg);box-shadow:2px 2px 0 #000}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 6px}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 8px 44px;min-height:36px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;display:grid;place-items:center;font:700 16px var(--head);color:#151b33;
  background:linear-gradient(180deg,#fff08a,var(--gold) 50%,var(--gold-d));border:2px solid #fff4b8;border-radius:5px;box-shadow:0 3px 0 #5f4800}
.note{border-left:6px solid var(--gold);background:rgba(255,211,0,.09);padding:12px 14px;border-radius:4px;margin:14px 0}
.quote{margin:8px 0 14px;padding:14px 18px;border-radius:6px;background:#0b1130;border:2px dashed #6f80c0;font-size:19px;font-style:italic}
.quote cite{display:block;margin-top:6px;font:700 13px var(--head);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ideas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.idea{background:#0b1130;border:2px solid #4b5c9e;border-radius:6px;padding:10px 12px}
.idea b{display:block;font:700 15px var(--head);letter-spacing:.04em;text-transform:uppercase;color:var(--gold-l)}
.idea span{font-size:15px;color:var(--muted)}
.tmrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:6px 0 4px}
.tmrow small{color:var(--muted);font-size:14px}

/* form fields */
.fld{display:block;margin:14px 0 4px}
.fld > .lbl{display:flex;gap:10px;font-weight:700;margin-bottom:6px;color:#fff}
.qn{flex:none;display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;font:700 14px var(--head);background:#0b1130;border:2px solid var(--gold);color:var(--gold);border-radius:4px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;font:16px/1.45 var(--body);color:var(--ink);background:var(--field);border:2px solid var(--field-line);border-radius:5px;padding:9px 11px;box-shadow:inset 0 2px 0 rgba(0,0,0,.45)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(255,211,0,.35), inset 0 2px 0 rgba(0,0,0,.45)}
input::placeholder,textarea::placeholder{color:#7d88b3}
input[type=date]{color-scheme:dark}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.checks{display:grid;gap:6px;margin:6px 0 10px}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;background:#0b1130;border:2px solid #3f4f8f;border-radius:5px;cursor:pointer}
.check:has(input:checked){border-color:var(--gold);background:#1b2350}
.check input{width:20px;height:20px;accent-color:var(--gold);flex:none}
.check input[type=text]{width:auto;flex:1;min-width:0;padding:6px 8px}

/* tables */
.tbl{margin:12px 0 6px}
.tbl-title{font:700 14px var(--head);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-l);margin-bottom:6px}
.thead,.trow{display:grid;grid-template-columns:30px var(--cols);gap:6px;align-items:start}
.thead{font:700 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 0 4px}
.trow{margin-bottom:6px}
.rn{display:grid;place-items:center;height:42px;font:700 14px var(--head);color:var(--gold);background:#0b1130;border:2px solid #3f4f8f;border-radius:4px}
.cell .lab{display:none}
.cell input,.cell select{padding:8px 9px}
.pbar{display:block;height:6px;margin-top:4px;background:#0b1130;border:1px solid #3f4f8f;border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .2s}
select.yes{border-color:var(--ok);color:var(--ok)}
select.no{border-color:var(--bad);color:var(--bad)}
.pctwrap{position:relative;display:block}
.pctwrap input{padding-right:28px}
.pctwrap::after{content:"%";position:absolute;right:10px;top:9px;color:var(--muted);font-weight:700;pointer-events:none}

/* tallies & spectrum */
.tally{margin:12px 0 4px;padding:12px 14px;background:#0b1130;border:2px solid #3f4f8f;border-radius:6px}
.tally .t-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}
.tally .t-top span{color:var(--muted);font-weight:400;font-size:15px}
.blocks{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.blocks i{width:22px;height:16px;border-radius:2px;transform:skewX(-14deg);background:#1b2350;border:2px solid #3f4f8f}
.blocks i.y{background:linear-gradient(180deg,#c8ffd0,var(--ok));border-color:#e5ffe9}
.blocks i.n{background:linear-gradient(180deg,#ffd0d0,var(--bad));border-color:#ffe3e3}
.spec{margin:10px 0 4px;background:#0b1130;border:2px solid #3f4f8f;border-radius:6px;padding:8px 8px 4px}
.spec svg{display:block;width:100%;height:auto}
.spec-note{font-size:14px;color:var(--muted);margin:4px 6px 6px}
.challenge{margin-top:16px}
.badge{display:inline-block;font:700 12px var(--head);letter-spacing:.12em;text-transform:uppercase;color:#151b33;background:var(--gold);padding:3px 8px;border-radius:3px;box-shadow:2px 2px 0 #000;margin-bottom:8px}

/* nav */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.nav .mid{font:700 13px var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* toast */
.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:20;width:min(560px,calc(100% - 32px));
  display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:8px;border:2px solid var(--line);
  background:linear-gradient(180deg,var(--win-top),var(--win-bot));box-shadow:inset 0 0 0 2px #0a0f26, inset 0 0 0 3px #7183c6, 0 8px 24px rgba(0,0,0,.6);
  transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.toast.show{transform:translate(-50%,0)}
.toast .star{flex:none;width:34px;height:34px;background:var(--gold);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);filter:drop-shadow(2px 2px 0 #000);animation:spin 1.2s steps(8) 1}
@keyframes spin{to{transform:rotate(360deg)}}
.toast b{display:block;font:700 15px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.toast p{margin:0;font-size:16px}
.toast small{display:block;color:var(--muted);font-size:14px;margin-top:2px}

/* glossary dialog */
dialog{width:min(640px,calc(100% - 24px));max-height:85vh;padding:0;border:2px solid var(--line);border-radius:8px;color:var(--ink);
  background:linear-gradient(180deg,var(--win-top),var(--win-bot));box-shadow:inset 0 0 0 2px #0a0f26, inset 0 0 0 3px #7183c6}
dialog::backdrop{background:rgba(3,6,18,.75)}
dialog .dlg{padding:18px 20px;overflow:auto;max-height:85vh}
.gl{display:grid;grid-template-columns:minmax(120px,30%) 1fr;gap:0;margin:0}
.gl dt,.gl dd{margin:0;padding:8px 6px;border-top:1px solid #3f4f8f}
.gl dt{font-weight:700;color:var(--gold-l)}
.dlg-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dlg-top h3{margin:0}

/* finish */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 4px}
.stat{background:#0b1130;border:2px solid #3f4f8f;border-radius:6px;padding:10px 12px}
.stat b{display:block;font:700 26px var(--head);color:var(--gold)}
.stat span{font-size:14px;color:var(--muted)}
.checklist{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.checklist button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:#0b1130;border:2px solid #3f4f8f;border-radius:5px;color:var(--ink);font:15px var(--body);cursor:pointer}
.checklist button:hover{border-color:var(--gold)}
.checklist .ok{color:var(--ok);font-weight:700}
.checklist .part{color:var(--gold-l);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.status{min-height:1.5em;color:var(--ok);font-weight:700;margin-top:8px}
.start-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.start-grid .fld:first-child{grid-column:1 / -1}
.welcome{font-size:18px}

#printout{display:none}
@media (max-width:680px){
  body{font-size:16px}
  .wrap{padding:10px 16px 32px}
  .plate img{height:28px}
  .row2,.ideas,.stats,.checklist,.start-grid{grid-template-columns:1fr}
  .thead{display:none}
  .trow{grid-template-columns:1fr 1fr;padding:10px;background:rgba(11,17,48,.6);border:2px solid #3f4f8f;border-radius:6px;margin-bottom:10px}
  .rn{grid-column:1/-1;display:block;height:auto;padding:0 2px;border:none;background:none;text-align:left}
  .spec{overflow-x:auto}
  .spec svg{min-width:560px}
  .rn::before{content:"Row "}
  .cell.wide{grid-column:1/-1}
  .cell .lab{display:block;font:700 12px var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .win{padding:16px 14px}
  .nav .mid{order:-1;width:100%;text-align:center}
  .nav .btn{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@page{margin:16mm}
@media print{
  body{background:#fff!important;color:#000;font:11pt/1.45 Arial,sans-serif}
  body > *:not(#printout){display:none!important}
  #printout{display:block}
  #printout h1{font-size:18pt;margin:0 0 4pt}
  #printout h2{font-size:13pt;margin:16pt 0 6pt;border-bottom:1.5pt solid #232D4B;padding-bottom:2pt;color:#232D4B;break-after:avoid}
  #printout .q{font-weight:700;margin:8pt 0 2pt;break-after:avoid}
  #printout .a{margin:0 0 6pt;white-space:pre-wrap}
  #printout .empty{color:#888;font-style:italic}
  #printout table{border-collapse:collapse;width:100%;margin:4pt 0 8pt;font-size:10pt}
  #printout th,#printout td{border:1px solid #888;padding:3pt 5pt;text-align:left;vertical-align:top}
  #printout th{background:#eef0f6}
  #printout .meta{margin:0 0 10pt}
  #printout img{height:36pt;width:auto;margin-bottom:8pt}
}
</style>
</head>
<body>

<script>
/* Tiny PS1-style software renderer: low resolution, snapped vertices,
   Gouraud shading, 15-bit colour with ordered dithering, distance fog. */
const GFX = (() => {
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const H = 120;
  let W = 256, cv, ctx, img, data, zb, sceneId = 'title', t0 = 0, last = 0, raf = 0, still = false;

  /* ---------- vector helpers ---------- */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const jit = (c, a, s) => { const k = 1 + (Math.sin(s * 12.9898) * 43758.5453 % 1) * a; return [c[0] * k, c[1] * k, c[2] * k]; };

  /* ---------- mesh builders ---------- */
  function finish(m) {
    // smooth vertex normals
    const vn = m.v.map(() => [0, 0, 0]);
    m.f.forEach(f => {
      const n = cross(sub(m.v[f[1]], m.v[f[0]]), sub(m.v[f[2]], m.v[f[0]]));
      for (let k = 0; k < 3; k++) { const q = vn[f[k]]; q[0] += n[0]; q[1] += n[1]; q[2] += n[2]; }
    });
    m.vn = vn.map(norm);
    return m;
  }
  function lathe(profile, seg, colFn, a0 = 0, a1 = Math.PI * 2) {
    const full = Math.abs(a1 - a0 - Math.PI * 2) < 1e-6, cols = full ? seg : seg + 1;
    const v = [], f = [];
    profile.forEach(([r, y]) => { for (let j = 0; j < cols; j++) { const a = a0 + (a1 - a0) * j / seg; v.push([Math.cos(a) * r, y, Math.sin(a) * r]); } });
    for (let i = 0; i < profile.length - 1; i++) for (let j = 0; j < seg; j++) {
      const j2 = full ? (j + 1) % seg : j + 1;
      const A = i * cols + j, B = i * cols + j2, C = (i + 1) * cols + j2, D = (i + 1) * cols + j;
      const col = colFn(i, j, (profile[i][1] + profile[i + 1][1]) / 2);
      f.push([A, C, B, col], [A, D, C, col]);
    }
    // make winding point away from the axis
    let best = 0, br = -1;
    f.forEach((q, k) => { const r = Math.hypot(v[q[0]][0], v[q[0]][2]); if (r > br) { br = r; best = k; } });
    const q = f[best], n = cross(sub(v[q[1]], v[q[0]]), sub(v[q[2]], v[q[0]]));
    const c = [(v[q[0]][0] + v[q[1]][0] + v[q[2]][0]) / 3, 0, (v[q[0]][2] + v[q[1]][2] + v[q[2]][2]) / 3];
    if (dot(n, c) < 0) f.forEach(t => { const s = t[1]; t[1] = t[2]; t[2] = s; });
    return finish({ v, f });
  }
  function ico(sub1, col, jitterAmt = 0, seed = 1) {
    const t = (1 + Math.sqrt(5)) / 2;
    let v = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map(norm);
    let f = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
    for (let s = 0; s < sub1; s++) {
      const cache = {}, nf = [];
      const mid = (a, b) => { const k = a < b ? a + '_' + b : b + '_' + a; if (cache[k] == null) { cache[k] = v.length; v.push(norm([(v[a][0] + v[b][0]) / 2, (v[a][1] + v[b][1]) / 2, (v[a][2] + v[b][2]) / 2])); } return cache[k]; };
      f.forEach(([a, b, c]) => { const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a); nf.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]); });
      f = nf;
    }
    if (jitterAmt) v = v.map((p, i) => { const k = 1 + Math.sin(i * 7.31 + seed) * jitterAmt; return [p[0] * k, p[1] * k, p[2] * k]; });
    const fo = f.map(([a, b, c], i) => [a, c, b, typeof col === 'function' ? col(i) : col]);
    // outward check
    const q = fo[0], n = cross(sub(v[q[1]], v[q[0]]), sub(v[q[2]], v[q[0]]));
    if (dot(n, v[q[0]]) < 0) fo.forEach(t => { const s = t[1]; t[1] = t[2]; t[2] = s; });
    return finish({ v, f: fo });
  }
  function box(w, h, d, col) {
    const x = w / 2, z = d / 2;
    const v = [[-x, 0, -z], [x, 0, -z], [x, 0, z], [-x, 0, z], [-x, h, -z], [x, h, -z], [x, h, z], [-x, h, z]];
    const quads = [[4, 7, 6, 5], [0, 1, 2, 3], [3, 2, 6, 7], [1, 0, 4, 5], [2, 1, 5, 6], [0, 3, 7, 4]];
    const f = [];
    quads.forEach((q, i) => { const c = Array.isArray(col[0]) ? col[i] : col; f.push([q[0], q[1], q[2], c], [q[0], q[2], q[3], c]); });
    // outward fix about the centre
    const cen = [0, h / 2, 0];
    f.forEach(t => { const n = cross(sub(v[t[1]], v[t[0]]), sub(v[t[2]], v[t[0]])); if (dot(n, sub(v[t[0]], cen)) < 0) { const s = t[1]; t[1] = t[2]; t[2] = s; } });
    const m = finish({ v, f }); m.flat = true; return m;
  }
  function xform(m, fn) { // returns new mesh with transformed vertices
    const v = m.v.map(fn);
    return finish(Object.assign({}, m, { v, f: m.f.map(t => t.slice()) }));
  }
  function merge(...ms) {
    const v = [], f = [];
    ms.forEach(m => { const o = v.length; m.v.forEach(p => v.push(p)); m.f.forEach(t => f.push([t[0] + o, t[1] + o, t[2] + o, t[3]])); });
    return finish({ v, f });
  }
  const rotX = a => p => [p[0], p[1] * Math.cos(a) - p[2] * Math.sin(a), p[1] * Math.sin(a) + p[2] * Math.cos(a)];
  const rotZ = a => p => [p[0] * Math.cos(a) - p[1] * Math.sin(a), p[0] * Math.sin(a) + p[1] * Math.cos(a), p[2]];
  const scl = (x, y, z) => p => [p[0] * x, p[1] * y, p[2] * z];
  const mov = (x, y, z) => p => [p[0] + x, p[1] + y, p[2] + z];

  /* ---------- palette ---------- */
  const C = {
    terra: hex('#c4683c'), terraD: hex('#7a3a20'), cream: hex('#efe2c4'), chert: hex('#b9a47e'),
    bone: hex('#e9ddc0'), gold: hex('#ffd300'), goldD: hex('#c99a00'), navy: hex('#232d4b'),
    navyL: hex('#3c4f8f'), sky: hex('#5ec8ff'), grey: hex('#8d93a3'), dark: hex('#262a36'),
    black: hex('#14161c'), white: hex('#e6e8ee'), brown: hex('#6b4a2e'), shadow: hex('#0a0e1e'), red: hex('#ff5d5d')
  };

  /* ---------- models ---------- */
  const M = {};

    title: t => [

      ...[M.pot, M.point, M.shell].map((m, k) => { const a = t * 0.45 + k * 2.094; return { m, p: [Math.cos(a) * 1.45, m === M.point ? 0.75 : 0, Math.sin(a) * 1.1 - 0.2], ry: t * 0.8 + k, s: m === M.pot ? 0.75 : 1, sh: 0.35 }; })
    ],
    crystal: t => [{ m: M.crystal, p: [0, 0.95 + Math.sin(t * 1.6) * 0.1, 0], ry: t * 0.8, s: 1.25, sh: 0.5 },
      ...[0, 1, 2, 3, 4].map(k => { const a = t * 0.7 + k * 1.2566; return { m: M.crystal, p: [Math.cos(a) * 1.5, 0.9 + Math.sin(t * 2 + k) * 0.25, Math.sin(a) * 0.9 - 0.3], ry: -t * 2 + k, s: 0.28 }; })],

})();

        { t: 'row', items: [{ t: 'field', id: 'classA', label: 'Class A', ph: 'e.g. Ceramic mugs' }, { t: 'field', id: 'classB', label: 'Class B', ph: 'e.g. Glass jars' }] },
        { t: 'q', id: 'p1_chars', label: 'What characteristics do you use to distinguish these two classes?' },
        { t: 'q', id: 'p1_visual', label: 'What visual information do you think a computer might use?' }

    },
    {
      id: 'p2', short: 'Part 2', kicker: 'Part 2', title: 'Train your first model', scene: 'webcam',
      cheer: 'First model trained! You are officially a machine-learning practitioner, {name}.',
      blocks: [
        { t: 'steps', items: ['Open Teachable Machine and choose <b>Get Started › Image Project › Standard image model</b>.', 'Rename the two classes to match your categories.', 'Collect about <b>50–100 images</b> of each class. For this first experiment, keep the conditions reasonably consistent.', 'Select <b>Train Model</b>.'] },
        { t: 'tm' },
        { t: 'q', id: 'p2_before', label: 'Before testing: how accurately do you think the model will distinguish your two classes, and why?' },
        { t: 'table', id: 't2', label: 'Test your model', dl: 'main', rows: 6, cols: [['Test', 'text'], ['Actual class', 'class'], ['Model prediction', 'class'], ['Confidence', 'pct']] },
        { t: 'q', id: 'p2_q1', n: 1, label: 'How successfully did your classifier distinguish the two classes?' },
        { t: 'q', id: 'p2_q2', n: 2, label: 'What visual characteristics do you think it might be using?' },
        { t: 'q', id: 'p2_q3', n: 3, label: 'Did anything about its behaviour surprise you?' }
      ]
    },
    {
      id: 'p3', short: 'Part 3', kicker: 'Part 3', title: 'Give it something new', scene: 'newthing',
      cheer: 'Watching what a model does with the unknown is where the real insight starts.',
      blocks: [
        { t: 'p', text: 'Choose a new example that is similar to your classes but was <b>not</b> included in the training data. If you trained Student A vs Student B, you might introduce Student C. If you used objects, find a new object that resembles one or both classes.' },
        { t: 'checks', id: 'p3_predict', label: 'Before testing, predict what will happen:', options: ['The classifier will refuse to classify it', 'It will identify it as something new', 'It will assign it to Class A', 'It will assign it to Class B'], other: 'Something else' },
        { t: 'table', id: 't3', label: 'Results', dl: 'main', rows: 3, cols: [['New example', 'text'], ['Prediction', 'class'], ['Confidence', 'pct']] },
        { t: 'q', id: 'p3_q4', n: 4, label: 'What happened?' },
        { t: 'q', id: 'p3_q5', n: 5, label: 'Was the classifier confident in its prediction?' },
        { t: 'q', id: 'p3_q6', n: 6, label: 'Does that mean its prediction was correct? Why or why not?' },
        { t: 'note', text: '<b>Important:</b> your classifier has been trained to answer ‘Is this A or B?’ It has not necessarily been trained to answer ‘Is this A, B, or something I have never encountered before?’' },
        { t: 'q', id: 'p3_arch', label: 'How might this distinction matter in a real archaeological classification problem?' }
      ]
    },
    {
      id: 'tray', short: 'Side quest', kicker: 'Side quest', title: 'The mystery tray', scene: 'tray',
      cheer: 'Side quest complete. You have mapped the edges of your model’s world, {name}.',
      blocks: [
        { t: 'p', text: 'Part 3 tested one stranger. Now set up a whole tray of them. Train a fresh model on <b>two groups of things</b>, then show it a small set of <b>third objects</b> that belong to neither group, or a bit to both. Plot where each one lands.' },
        { t: 'ideas', items: [
          ['Shells vs stones', 'Then test: sea glass, a piece of coral, a fossil, a pottery sherd.'],
          ['Ceramic vs glass', 'Then test: a glazed tile, an enamel mug, a clear plastic cup, a brick fragment.'],
          ['Coins vs buttons', 'Then test: a washer, a bottle cap, a token, a medal.'],
          ['Wood vs metal cutlery', 'Then test: a bamboo spoon, a plastic fork, a bone-handled knife.']
        ] },
        { t: 'steps', items: ['Gather several <b>different examples</b> of each group, not just one object filmed many times.', 'Capture about 30–50 images per group and train. Keep your third objects out of sight while you train.', 'Before you test each third object, record your guess. Then hold it up and note the prediction and confidence.'] },
        { t: 'row', items: [{ t: 'field', id: 'trayA', label: 'Group A', ph: 'e.g. Shells' }, { t: 'field', id: 'trayB', label: 'Group B', ph: 'e.g. Stones' }] },
        { t: 'table', id: 'tt', label: 'Third objects', dl: 'tray', rows: 5, cols: [['Third object', 'text'], ['Your guess', 'guess'], ['Model said', 'class'], ['Confidence', 'pct']] },
        { t: 'spectrum', table: 'tt' },
        { t: 'q', id: 'tray_tried', label: 'What did you try to do?' },
        { t: 'q', id: 'tray_how', label: 'How did it go? Where did your third objects end up?' },
        { t: 'q', id: 'tray_why', label: 'Pick the object that surprised you most. What visual features might have pulled it towards that group?' },
        { t: 'q', id: 'tray_arch', label: 'Archaeologists often meet finds that fit none of their categories. What does the tray tell you about using a two-class model on real material?' }
      ]
    },
    {
      id: 'p4', short: 'Part 4', kicker: 'Part 4', title: 'Test generalisation', scene: 'light',
      cheer: 'Great testing, {name}. That is how real evaluation works.',
      blocks: [
        { t: 'p', text: 'A useful model should ideally work beyond the exact circumstances represented in its training data. This is called <b>generalisation</b>. Change one condition at a time where possible: orientation, distance, position, lighting, background, partial obstruction, or another characteristic.' },
        { t: 'table', id: 't4', label: 'Changed conditions', dl: 'main', rows: 8, cols: [['Changed condition', 'text'], ['Actual class', 'class'], ['Prediction', 'class'], ['Confidence', 'pct'], ['Correct?', 'yesno']] },
        { t: 'tally', table: 't4', label: 'Your original model under changed conditions' },
        { t: 'q', id: 'p4_q7', n: 7, label: 'Which changes had the greatest effect on your classifier?' },
        { t: 'q', id: 'p4_q8', n: 8, label: 'Which changes had surprisingly little effect?' },
        { t: 'q', id: 'p4_q9', n: 9, label: 'Why might changing something that seems irrelevant to you affect the classifier?' }
      ]
    },
    {
      id: 'p5', short: 'Part 5', kicker: 'Part 5', title: 'Can you trick the machine?', scene: 'split',
      cheer: 'You just fooled a classifier on purpose. That is a research skill plenty of published studies skip.',
      blocks: [
        { t: 'p', text: 'Create a new model using the same two classes, but deliberately introduce a <b>systematic difference</b> that should have nothing to do with the classification. For example, use a different background, position, distance, lighting or orientation for each class.' },
        { t: 'row', items: [{ t: 'field', id: 'p5_a', label: 'For Class A we will:', ph: 'e.g. shoot on a black cloth' }, { t: 'field', id: 'p5_b', label: 'For Class B we will:', ph: 'e.g. shoot on white paper' }] },
        { t: 'table', id: 't5', label: 'Test the tricked model', dl: 'main', rows: 4, cols: [['Test', 'text'], ['Prediction', 'class'], ['Confidence', 'pct']] },
        { t: 'p', text: 'Now <b>reverse or remove</b> the irrelevant characteristic. For example, swap the backgrounds while keeping the objects unchanged. Also try showing only the background or other irrelevant feature.' },
        { t: 'q', id: 'p5_what', label: 'What happened?' },
        { t: 'q', id: 'p5_q10', n: 10, label: 'Was the classifier learning the distinction you intended?' },
        { t: 'q', id: 'p5_q11', n: 11, label: 'What other information might it have learned instead?' },
        { t: 'q', id: 'p5_q12', n: 12, label: 'Could the classifier have appeared highly accurate before this test? Explain.' },
        { t: 'q', id: 'p5_q13', n: 13, label: 'What does this tell you about evaluating machine-learning models?' }
      ]
    },
    {
      id: 'p6', short: 'Part 6', kicker: 'Part 6', title: 'Build a better classifier', scene: 'lineup',
      cheer: 'Better data, better model. Nicely done, {name}.',
      blocks: [
        { t: 'p', text: 'Return to your original problem and redesign the training data to make the model more robust. Think about <b>diversity and representativeness</b> rather than simply collecting more images. Include useful variation in lighting, background, orientation, position, distance and, where appropriate, different examples belonging to the same category.' },
        { t: 'q', id: 'p6_change', label: 'What will you change in your training dataset?' },
        { t: 'q', id: 'p6_why', label: 'Why should this make the classifier more generalisable?' },
        { t: 'p', text: 'Train the improved model. Test it using examples or conditions deliberately excluded from training.' },
        { t: 'table', id: 't6', label: 'Unseen tests', dl: 'main', rows: 5, cols: [['Unseen test', 'text'], ['Actual class', 'class'], ['Prediction', 'class'], ['Confidence', 'pct'], ['Correct?', 'yesno']] },
        { t: 'compare' },
        { t: 'q', id: 'p6_which', label: 'Which model performed better on unseen data, and why?' }
      ]
    },
    {
      id: 'p7', short: 'Part 7', kicker: 'Part 7', title: 'Break your classifier', scene: 'broken',
      cheer: 'Broken on purpose. Every model has a weak spot, and you found one.',
      blocks: [
        { t: 'p', text: 'Find something your improved classifier gets <b>confidently wrong</b>. Try unusual examples, similar-looking objects, partial examples, unusual orientations or backgrounds, combinations of objects, or something unrelated.' },
        { t: 'field', id: 'p7_show', label: 'What did you show it?' },
        { t: 'row', items: [{ t: 'field', id: 'p7_pred', label: 'What did it predict?' }, { t: 'pctfield', id: 'p7_conf', label: 'Confidence' }] },
        { t: 'q', id: 'p7_why', label: 'Why do you think it made this mistake?' }
      ]
    },
    {
      id: 'p8', short: 'Part 8', kicker: 'Part 8', title: 'From webcam experiments to archaeology', scene: 'arch',
      cheer: 'Sharp thinking, {name}. These are exactly the questions a good reviewer asks.',
      blocks: [
        { t: 'p', text: 'Imagine applying the same ideas to pottery, stone artefacts, animal bones, shell, rock-art motifs, raw materials, site types, or archaeological imagery.' },
        { t: 'challenge', n: 1, title: 'Training data', text: 'All examples of Ceramic Type A come from Museum A and were photographed against a black background. All examples of Type B come from Museum B and were photographed against a white background. The model reports 99% accuracy.',
          qs: [{ id: 'c1', label: 'Would you trust the result? What would you need to know before accepting it?' }] },
        { t: 'challenge', n: 2, title: 'Generalisation', text: 'A classifier is trained using complete, well-preserved artefacts from a museum collection and then applied to newly excavated material consisting mostly of small, weathered fragments.',
          qs: [{ id: 'c2a', label: 'What problems might you encounter?' }, { id: 'c2b', label: 'How could you improve the training dataset?' }] },
        { t: 'challenge', n: 3, title: 'What is the model really learning?', text: 'A model accurately predicts which of three sites stone artefacts came from. Site A artefacts were photographed with a scale bar, Site B artefacts without one, and Site C artefacts while still sitting on sediment.',
          qs: [{ id: 'c3', label: 'Has the model necessarily discovered archaeological differences between the assemblages? Why or why not?' }] }
      ]
    },
    {
      id: 'refl', short: 'Reflect', kicker: 'Final reflection', title: 'What have you learned?', scene: 'crystal',
      cheer: 'Nearly there, {name}. Great reflection.',
      blocks: [
        { t: 'q', id: 'r1', label: 'What makes good training data?' },
        { t: 'q', id: 'r2', label: 'Why should a model be tested using data it has never seen before?' },
        { t: 'q', id: 'r3', label: 'In your own words, what does generalisation mean?' },
        { t: 'q', id: 'r4', label: 'Why might collecting more training images not necessarily produce a better model?' },
        { t: 'q', id: 'r5', label: 'What does a high confidence score tell you, and what does it not tell you?' },
        { t: 'quote', text: '“Our machine-learning classifier achieved 97% accuracy when classifying archaeological artefacts.”', who: 'A researcher' },
        { t: 'p', text: 'Write three questions you would ask before deciding whether that result is convincing.' },
        { t: 'field', id: 'r6a', label: 'Question 1' },
        { t: 'field', id: 'r6b', label: 'Question 2' },
        { t: 'field', id: 'r6c', label: 'Question 3' }
      ]
    },
    {
      id: 'debrief', short: 'Debrief', kicker: 'Debrief', title: 'You and the machine', scene: 'debrief',
      cheer: 'Lab complete! Brilliant work, {name}.',
      blocks: [
        { t: 'p', text: 'Last stop. Step back from the individual tests and think about the whole session, and where this could go next for you.' },
        { t: 'q', id: 'd_tried', label: 'What did you set out to do in this lab, and what did you actually try?' },
        { t: 'q', id: 'd_how', label: 'How did it go? What worked, what didn’t, and what would you do differently next time?' },
        { t: 'q', id: 'd_own', label: 'How could image classification (or machine learning more broadly) be used in your own work, such as a thesis, project, job or interest?' },
        { t: 'q', id: 'd_field', label: 'How could it be used in archaeology or heritage more broadly, and what would you need to be careful about?' }
      ]
    },
    { id: 'end', short: 'Finish', scene: 'trophy' }
  ],
  glossary: [
    ['Class', 'A category that a classifier can predict.'],
    ['Training data', 'Examples used to train a machine-learning model.'],
    ['Classification', 'Assigning an example to one of a set of predefined classes.'],
    ['Test data', 'Data kept separate from training and used to evaluate a model.'],
    ['Unseen data', 'Examples the model did not encounter during training.'],
    ['Generalisation', 'The ability of a model to perform successfully on new data.'],
    ['Overfitting', 'When a model learns its training data too specifically and performs poorly on new examples.'],
    ['Bias', 'Systematic patterns in data or a model that can distort predictions.'],
    ['Confounding feature', 'A feature associated with a class that is not the phenomenon the researcher intended the model to learn.'],
    ['Confidence', 'How strongly the model favours one available classification, not a guarantee that it is correct.']
  ],
  takeHome: [
    'Machine learning does not automatically learn the concept that the researcher has in mind. A classifier learns patterns from the examples provided to it. In archaeology, site, collection, preservation, recording method, photography, excavation history and sampling can all become part of the dataset. A classifier may therefore learn patterns that are statistically powerful but archaeologically meaningless.',
    'The challenge is not simply to build a classifier that works. It is to demonstrate that it works for the archaeological reasons we think it does.'
  ],
  emptyNote: ['One box is still empty. You can come back to it any time.', '{n} boxes are still empty. You can come back to them any time.']

</script>
<script>
(() => {
  const KEY = 'digitalpasts-teach-the-machine-v1';
  const P = CONTENT.pages, LAST = P.length - 1;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  /* ---------- state ---------- */
  let st = { name: '', group: '', date: today(), f: {}, page: 0, max: 0 };
  let storeOK = true;
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && typeof s === 'object' && s.f) st = Object.assign(st, s); } } catch (e) { storeOK = false; }
  let saveT = 0;
  function save() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(st)); storeOK = true; } catch (e) { storeOK = false; }
      const s = $('saved');
      if (storeOK) { s.textContent = '● Saved'; s.className = 'saved on'; setTimeout(() => { s.className = 'saved'; }, 900); }
      else { s.textContent = 'Not saving'; s.className = 'saved off'; s.title = 'This browser is not letting the page save. Download or print your answers before closing.'; }
    }, 250);
  }
  const val = k => (st.f[k] == null ? '' : String(st.f[k]));
  const cls = () => [st.f.classA, st.f.classB].map(x => (x || '').trim());
  const trayCls = () => [st.f.trayA, st.f.trayB].map(x => (x || '').trim());
  const nm = () => (st.name || '').trim() || 'Explorer';
  const first = () => nm().split(/\s+/)[0];

  /* ---------- boxes (for completion) ---------- */
  function boxes(page) {
    const out = [];
    const walk = bl => bl.forEach(b => {
      if (b.t === 'row') walk(b.items);
      else if (b.t === 'q' || b.t === 'field' || b.t === 'pctfield') out.push({ type: 'v', k: b.id });
      else if (b.t === 'checks') out.push({ type: 'checks', b });
      else if (b.t === 'table') out.push({ type: 'table', b });
      else if (b.t === 'challenge') b.qs.forEach(q => out.push({ type: 'v', k: q.id }));
    });
    walk(page.blocks || []);
    return out;
  }
  function filled(x) {
    if (x.type === 'v') return val(x.k).trim() !== '';
    if (x.type === 'checks') return x.b.options.some((_, i) => st.f[x.b.id + '.' + i]) || (st.f[x.b.id + '.otherOn'] && val(x.b.id + '.other').trim());
    if (x.type === 'table') { for (let r = 0; r < x.b.rows; r++) for (let c = 0; c < x.b.cols.length; c++) if (val(x.b.id + '.' + r + '.' + c).trim()) return true; return false; }
    return false;
  }
  function pageStats(i) { const bx = boxes(P[i]); return { total: bx.length, done: bx.filter(filled).length }; }
  function allStats() { let t = 0, d = 0; P.forEach((_, i) => { const s = pageStats(i); t += s.total; d += s.done; }); return { total: t, done: d }; }

  /* ---------- block rendering ---------- */
  function fieldHTML(b) {
    const n = b.n ? `<span class="qn">${b.n}</span>` : '';
    if (b.t === 'q') return `<label class="fld"><span class="lbl">${n}<span>${b.label}</span></span><textarea data-k="${b.id}" rows="3"></textarea></label>`;
    if (b.t === 'pctfield') return `<label class="fld"><span class="lbl"><span>${b.label}</span></span><span class="pctwrap"><input type="number" min="0" max="100" step="1" inputmode="numeric" data-k="${b.id}" data-pct></span><span class="pbar"><i></i></span></label>`;
    return `<label class="fld"><span class="lbl">${n}<span>${b.label}</span></span><input type="text" data-k="${b.id}" ${b.ph ? `placeholder="${esc(b.ph)}"` : ''} autocomplete="off"></label>`;
  }
  function guessOpts() {
    const [a, b] = trayCls();
    return [['', '—'], ['A', 'Group A' + (a ? ': ' + a : '')], ['B', 'Group B' + (b ? ': ' + b : '')], ['M', 'In between'], ['?', 'No idea']];
  }
  function tableHTML(b) {
    const fr = b.cols.map(([, ty]) => ty === 'text' ? '1.5fr' : ty === 'pct' ? '0.8fr' : ty === 'yesno' ? '0.7fr' : '1fr').join(' ');
    let h = `<div class="tbl" style="--cols:${fr}"><div class="tbl-title">${b.label}</div><div class="thead" aria-hidden="true"><span>#</span>${b.cols.map(c => `<span>${c[0]}</span>`).join('')}</div>`;
    for (let r = 0; r < b.rows; r++) {
      h += `<div class="trow" role="group" aria-label="${esc(b.label)}, row ${r + 1}"><span class="rn">${r + 1}</span>`;
      b.cols.forEach(([lab, ty], c) => {
        const k = `${b.id}.${r}.${c}`, aria = `aria-label="${esc(lab)}, row ${r + 1}"`;
        let inner;
        if (ty === 'text') inner = `<input type="text" data-k="${k}" ${aria} autocomplete="off">`;
        else if (ty === 'class') inner = `<input type="text" data-k="${k}" ${aria} list="dl-${b.dl}" autocomplete="off">`;
        else if (ty === 'pct') inner = `<span class="pctwrap"><input type="number" min="0" max="100" step="1" inputmode="numeric" data-k="${k}" data-pct ${aria}></span><span class="pbar"><i></i></span>`;
        else if (ty === 'yesno') inner = `<select data-k="${k}" data-yn ${aria}><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select>`;
        else if (ty === 'guess') inner = `<select data-k="${k}" data-guess ${aria}>${guessOpts().map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('')}</select>`;
        h += `<label class="cell${ty === 'text' ? ' wide' : ''}"><span class="lab">${lab}</span>${inner}</label>`;
      });
      h += `</div>`;
    }
    return h + `</div>`;
  }
  function blockHTML(b) {
    switch (b.t) {
      case 'p': return `<p>${b.text}</p>`;
      case 'list': return `<ul class="dots">${b.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
      case 'steps': return `<ol class="steps">${b.items.map(i => `<li>${i}</li>`).join('')}</ol>`;
      case 'note': return `<div class="note">${b.text}</div>`;
      case 'quote': return `<blockquote class="quote">${b.text}<cite>${b.who}</cite></blockquote>`;
      case 'tm': return `<div class="tmrow"><a class="btn" href="${TM_URL}" target="_blank" rel="noopener">Open Teachable Machine &#8599;</a><small>Opens in a new tab. Allow camera access when your browser asks.</small></div>`;
      case 'howto': return `<div class="note"><b>How this lab works</b><ul class="dots" style="margin:8px 0 0"><li>Work through the stages in order. The bar at the top shows where you are, and you can jump back to any stage you have reached.</li><li>Keep Teachable Machine open in another tab and switch between the two.</li><li>Your answers save in this browser as you type. Nothing is sent anywhere.</li><li>At the end you can copy your answers, download them, or print or save them as a PDF.</li></ul></div>`;
      case 'ideas': return `<div class="ideas">${b.items.map(([h, t]) => `<div class="idea"><b>${h}</b><span>${t}</span></div>`).join('')}</div>`;
      case 'row': return `<div class="row2">${b.items.map(fieldHTML).join('')}</div>`;
      case 'q': case 'field': case 'pctfield': return fieldHTML(b);
      case 'checks': return `<fieldset class="fld" style="border:0;padding:0;margin:14px 0 4px"><legend class="lbl" style="font-weight:700;margin-bottom:6px;padding:0">${b.label}</legend><div class="checks">${b.options.map((o, i) => `<label class="check"><input type="checkbox" data-k="${b.id}.${i}"><span>${o}</span></label>`).join('')}<label class="check"><input type="checkbox" data-k="${b.id}.otherOn" aria-label="${b.other}"><span>${b.other}:</span><input type="text" data-k="${b.id}.other" aria-label="${b.other}, describe" autocomplete="off"></label></div></fieldset>`;
      case 'table': return tableHTML(b);
      case 'tally': return `<div class="tally" data-tally="${b.table}" data-label="${esc(b.label)}"></div>`;
      case 'compare': return `<div class="tally" data-tally="t4" data-label="Part 4 · original model, changed conditions"></div><div class="tally" data-tally="t6" data-label="Part 6 · improved model, unseen tests"></div>`;
      case 'spectrum': return `<div class="spec" data-spec="${b.table}"></div>`;
      case 'challenge': return `<div class="challenge"><span class="badge">Challenge ${b.n}</span><h3 style="margin:0 0 6px;font:700 17px var(--head);letter-spacing:.05em;text-transform:uppercase;color:#fff">${b.title}</h3><p>${b.text}</p>${b.qs.map(q => fieldHTML({ t: 'q', id: q.id, label: q.label })).join('')}</div>`;
    }
    return '';
  }

  /* ---------- dynamic widgets ---------- */
  function updDatalists() {
    $('dl-main').innerHTML = cls().filter(Boolean).map(c => `<option value="${esc(c)}">`).join('');
    $('dl-tray').innerHTML = trayCls().filter(Boolean).map(c => `<option value="${esc(c)}">`).join('');
    document.querySelectorAll('select[data-guess]').forEach(s => { const v = s.value; s.innerHTML = guessOpts().map(([o, t]) => `<option value="${o}">${esc(t)}</option>`).join(''); s.value = v; });
  }
  function rowCount(tid) { const b = findTable(tid); return b ? b.rows : 0; }
  function findTable(tid) { for (const p of P) for (const b of (p.blocks || [])) if (b.t === 'table' && b.id === tid) return b; return null; }

      t => { h += `<h2>${esc(t)}</h2>`; },
      (q, a) => { h += `<p class="q">${esc(q)}</p><p class="a${a ? '' : ' empty'}">${a ? esc(a) : 'No answer'}</p>`; },
      (t, head, rows) => { h += `<p class="q">${esc(t)}</p>` + (rows.length ? `<table><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table>` : `<p class="a empty">No results</p>`); },
      t => { h += `<p>${esc(t)}</p>`; }
    );
    $('printout').innerHTML = h;
  }
  function status(msg) { const s = $('endStatus'); if (s) { s.textContent = msg; setTimeout(() => { if (s.textContent === msg) s.textContent = ''; }, 5000); } }
  function copyText(txt) {
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { } ta.remove(); status(ok ? 'Copied. Paste it wherever your tutor asks.' : 'Copy did not work in this browser. Try Download instead.'); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => status('Copied. Paste it wherever your tutor asks.'), fallback); else fallback();
  }
  function download() {
    const safe = (st.name.trim() || 'answers').replace(/[^\w\- ]+/g, '').replace(/\s+/g, '_');
    const blob = new Blob([exportText()], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Teach_the_Machine_${safe}.txt`; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    status('Downloaded. Check your Downloads folder.');
  }
  addEventListener('beforeprint', buildPrint);

  /* ---------- boot ---------- */
  GFX.init($('scene'));
  if (!storeOK) { const s = $('saved'); s.textContent = 'Not saving'; s.className = 'saved off'; }
  go(0, { keepScroll: true });
  window.__dp = { st: () => st, go, exportText };
})();
</script>
</body>
</html>
